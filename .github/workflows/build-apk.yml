# Colour Clash — GitHub Actions workflow.
# HOW TO USE (browser step — the GitHub App cannot write .github/workflows/):
# 1. In your GitHub repo, go to Actions -> New workflow -> "set up a workflow yourself".
# 2. Name the file .github/workflows/build-apk.yml and paste this whole file.
# 3. Commit it, then push any change (or press Run workflow).
# The APK appears under Actions -> latest run -> Artifacts -> color-clash-apk.
name: Build APK


on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: color-clash-apk
          path: build/app/outputs/flutter-apk/app-release.apk
